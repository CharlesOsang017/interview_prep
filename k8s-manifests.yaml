apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-frontend-app
  namespace: dev
  labels:
    app: my-frontend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-frontend-app
  template:
    metadata:
      labels:
        app: my-frontend-app
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: frontend
          image: registry.gitlab.com/agile-development-group/agentic-app/frontend:latest
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: my-frontend-svc
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: my-frontend-app
  ports:
    - port: 80
      targetPort: 5173
